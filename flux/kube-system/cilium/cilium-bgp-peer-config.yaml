apiVersion: cilium.io/v2
kind: CiliumBGPPeerConfig
metadata:
  name: mikrotik-v4
  namespace: kube-system
spec:
  timers:
    connectRetryTimeSeconds: 5
    keepAliveTimeSeconds: 5
    holdTimeSeconds: 15
  gracefulRestart:
    enabled: true
    restartTimeSeconds: 15
  families:
  - afi: ipv4
    safi: unicast
    advertisements:
      matchLabels:
        advertise: bgp
---
apiVersion: cilium.io/v2
kind: CiliumBGPPeerConfig
metadata:
  name: mikrotik-v6
  namespace: kube-system
spec:
  timers:
    connectRetryTimeSeconds: 5
    keepAliveTimeSeconds: 5
    holdTimeSeconds: 15
  gracefulRestart:
    enabled: true
    restartTimeSeconds: 15
  families:
  - afi: ipv6
    safi: unicast
    advertisements:
      matchLabels:
        advertise: bgp
    
