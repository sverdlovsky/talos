apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: hubble-metrics
  namespace: flux-system
spec:
  dependsOn:
  - name: cilium
  - name: tetragon
  - name: kube-prometheus-stack
  interval: 15m0s
  path: ./flux/kube-system/hubble-metrics
  prune: true
  wait: true
  timeout: 5m0s
  sourceRef:
    kind: GitRepository
    name: flux-system

