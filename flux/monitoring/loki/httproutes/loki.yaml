apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: loki
  namespace: monitoring
spec:
  parentRefs:
  - name: public
    namespace: kube-system
    sectionName: loki
  hostnames:
  - loki.${DOMAIN}
  rules:
  - backendRefs:
    - name: loki
      port: 3100
    timeouts:
      request: 30m

