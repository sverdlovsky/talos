apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: prom
  namespace: monitoring
spec:
  parentRefs:
  - name: private
    namespace: kube-system
    sectionName: prom
  hostnames:
  - prom.${DOMAIN}
  rules:
  - backendRefs:
    - name: kube-prometheus-stack-prometheus
      port: 9090

