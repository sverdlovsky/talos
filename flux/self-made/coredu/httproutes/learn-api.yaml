apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: learn-api
  namespace: self-made
spec:
  parentRefs:
  - name: public
    namespace: kube-system
    sectionName: learn-api
  hostnames:
  - api.learn.${DOMAIN}
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: coredu
      port: 8080
    timeouts:
      request: "60s"

