apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: learn-media
  namespace: self-made
spec:
  parentRefs:
  - name: public
    namespace: kube-system
    sectionName: learn-media
  hostnames:
  - media.learn.${DOMAIN}
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: coredu
      port: 80

