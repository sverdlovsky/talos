apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: learn
  namespace: self-made
spec:
  parentRefs:
  - name: public
    namespace: kube-system
    sectionName: learn
  hostnames:
  - learn.${DOMAIN}
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: coredu
      port: 80

