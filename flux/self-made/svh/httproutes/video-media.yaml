apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: video-media
  namespace: self-made
spec:
  parentRefs:
  - name: public
    namespace: kube-system
    sectionName: video-media
  hostnames:
  - media.video.${DOMAIN}
  rules:
  - backendRefs:
    - name: svh
      port: 80

